[workspace]
members = [
    "crates/daemon",
    "crates/fractory",
]
resolver = "3"

[workspace.dependencies]
fractory = { path = "crates/fractory", default-features = false }
fractory-daemon = { path = "crates/daemon" }

anyhow = { version = "1", default-features = false }
assert_cmd = { version = "2", default-features = false }
bincode = { version = "2" }
clap = { version = "4", default-features = false, features = ["std"] }
env_logger = { version = "0.11" }
flume = { version = "0.11" }
futures = { version = "0.3" }
gix = { version = "0.71", default-features = false }
log = { version = "0.4" }
mio = { version = "1" }
nix = { version = "0.29" }
pretty_assertions = { version = "1", features = ["unstable"] }
rand = { version = "0.9", default-features = false, features = ["std", "thread_rng"] }
ringbuf = { version = "0.4" }
tokio = { version = "1", default-features = false }
tokio-stream = { version = "0.1" }
tokio-util = { version = "0.7" }
users = { version = "0.11" }
widestring = { version = "1", default-features = false, features = ["std"] }
windows = { version = "0.61", default-features = false, features = ["std"] }
windows-service = { version = "0.8" }

[workspace.package]
version = "0.0.0"
authors = ["Kamil Becmer"]
edition = "2024"
rust-version = "1.86.0" # TODO: Reevaluate and lift MSRV after a compatibility review session
description = "Track intent and flow, preserve context, and reconstruct sessions — for mosaic thinkers."
documentation = "https://docs.fractory.dev"
readme = "README.md"
homepage = "https://fractory.dev"
repository = "https://github.com/becmer/fractory"
license = "MIT OR Apache-2.0"
keywords = ["workflow", "productivity", "intent", "session-tracking", "nonlinear"]
categories = ["development-tools", "command-line-utilities", "text-processing", "visualization"]
